[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pg-audit-diff"
dynamic = ["version"]
description = "PostgreSQL schema drift detection and logical comparison"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Youssef Gamal" }]
dependencies = [
    "typer>=0.16.0",
    "rich>=13.7.0",
    "psycopg>=3.1.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
binary = [
    "psycopg[binary]>=3.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "types-PyYAML>=6.0.0",
    "psycopg[binary]>=3.1.0",
]

[project.scripts]
pg-audit-diff = "pg_audit_diff.cli:run"

[tool.hatch.version]
path = "src/pg_audit_diff/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_audit_diff"]

[tool.hatch.build.targets.sdist]
include = ["src/pg_audit_diff"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["S101", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --tb=short"
